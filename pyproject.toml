[project]
name = "agent-loop"
version = "0.2.0"
description = "Multi-provider (Claude / OpenAI / Gemini) agent loop with robust interruption and multiplayer sessions"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "openai>=1.66",
    "anthropic>=0.60",
    "prompt_toolkit>=3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.50"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "fastapi>=0.110", "google-genai>=1.50"]

[project.scripts]
agent = "agent_loop.cli:main"
agent-server = "agent_loop.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_loop"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
