name: Publish site

# The web UI is one self-contained file. On GitHub Pages it opens in demo
# mode (simulated agent in the browser) and can connect to any agent-server.
on:
  push:
    branches: [main]
    paths: ["src/agent_loop/web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push src/agent_loop/web to the gh-pages branch
        run: |
          mkdir site && cp -r src/agent_loop/web/. site/ && touch site/.nojekyll
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Publish site from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
